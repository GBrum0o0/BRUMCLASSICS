name: Build iOS pessoal

on:
  workflow_call:
    inputs:
      experimental:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      experimental:
        description: "Build de teste com Arcade/3DS/GameCube e demais backends experimentais; não publicar release"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "shared/brum-core/**"
      - "LICENSES/**"
      - "MOBILE-LICENSING.md"
      - ".github/workflows/build-ios-personal.yml"

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Validar componentes compartilhados
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror shared/brum-core/tests.cpp -o "$RUNNER_TEMP/brum-core-tests"
          "$RUNNER_TEMP/brum-core-tests"

      - name: Validar projeto e testes do pacote
        working-directory: ios
        run: |
          node validate-ios-project.js
          python3 -m unittest -v test_validate_ipa.py

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        working-directory: ios
        run: xcodegen generate

      - name: Testar modelos e navegacao no simulador iPhone
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"] and x.get("isAvailable")))')
          XCODE_LOG="$RUNNER_TEMP/brumclassics-xcode-simulator.log"
          XCODE_ERRORS="$RUNNER_TEMP/brumclassics-xcode-errors.log"
          set +e
          perl -e 'alarm shift; exec @ARGV or die $!' 720 \
            xcodebuild -project BRUMCLASSICSMobile.xcodeproj -scheme BRUMCLASSICSMobile -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/Simulator \
            -resultBundlePath build/iOS-Tests.xcresult -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$XCODE_LOG"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$XCODE_STATUS" -ne 0 ]; then
            grep -E '(^|[[:space:]])(error:|fatal error:)|Test Case.*failed|Testing failed:' "$XCODE_LOG" \
              | tail -n 20 > "$XCODE_ERRORS" || true
            if [ ! -s "$XCODE_ERRORS" ]; then tail -n 20 "$XCODE_LOG" > "$XCODE_ERRORS"; fi
            while IFS= read -r LINE; do
              LINE=$(printf '%s' "$LINE" | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' | cut -c1-1800)
              LINE=${LINE//'%'/'%25'}
              LINE=${LINE//$'\r'/'%0D'}
              echo "::error title=Xcode::$LINE"
            done < "$XCODE_ERRORS"
            exit "$XCODE_STATUS"
          fi

      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRUMCLASSICS-IOS-TESTES-0.15.1
          path: ios/build/iOS-Tests.xcresult
          retention-days: 7
          if-no-files-found: warn

      - name: Compilar aplicativo sem assinatura
        working-directory: ios
        run: >-
          xcodebuild
          -project BRUMCLASSICSMobile.xcodeproj
          -scheme BRUMCLASSICSMobile
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Compilar núcleo integrado mGBA
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          CORE_COMMIT="7a12d6d4b9acb14c0ae62c9166b6a2f3d08007f6"
          git clone --filter=blob:none https://github.com/libretro/mgba.git build/mgba-core
          git -C build/mgba-core checkout --detach "$CORE_COMMIT"
          # This pinned mGBA revision builds the Libretro target with CMake.
          # Its generic Apple branch otherwise replaces the iOS deployment
          # target with an old macOS value, so keep that override macOS-only.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build/mgba-core/CMakeLists.txt")
          source = path.read_text(encoding="utf-8")
          old = 'if(NOT CMAKE_SYSTEM_VERSION VERSION_LESS "10.0") # Darwin 10.x is Mac OS X 10.6'
          new = 'if(NOT CMAKE_SYSTEM_NAME STREQUAL "iOS" AND NOT CMAKE_SYSTEM_VERSION VERSION_LESS "10.0") # Darwin 10.x is Mac OS X 10.6'
          if source.count(old) != 1:
              raise SystemExit("Unexpected mGBA Apple deployment-target block")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          cmake -S build/mgba-core -B build/mgba-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DBUILD_LIBRETRO=ON \
            -DLIBRETRO_STATIC=OFF \
            -DDISABLE_FRONTENDS=ON \
            -DDISABLE_DEPS=ON \
            -DSKIP_LIBRARY=ON \
            -DBUILD_SHARED=OFF \
            -DBUILD_STATIC=OFF
          cmake --build build/mgba-ios --config Release --target mgba_libretro --parallel "$(sysctl -n hw.ncpu)"
          CORE_PATH=$(find build/mgba-ios -type f -name 'mgba_libretro*.dylib' -print -quit)
          test -n "$CORE_PATH"
          APP="build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app"
          mkdir -p "$APP/Frameworks"
          cp "$CORE_PATH" "$APP/Frameworks/mgba_libretro_ios.dylib"
          cp build/mgba-core/LICENSE "$APP/Frameworks/mGBA-LICENSE.txt"
          chmod 755 "$APP/Frameworks/mgba_libretro_ios.dylib"
          file "$APP/Frameworks/mgba_libretro_ios.dylib" | grep -q arm64

      - name: Compilar núcleo integrado SkyEmu
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          CORE_COMMIT="36771a16bfde7eb5c1c0315877b5e465e6f38858"
          git clone --depth 1 --branch v4 https://github.com/skylersaleh/SkyEmu.git build/skyemu-core
          test "$(git -C build/skyemu-core rev-parse HEAD)" = "$CORE_COMMIT"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build/skyemu-core/CMakeLists.txt")
          source = path.read_text(encoding="utf-8")
          old = 'set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64" CACHE STRING "" FORCE)'
          new = 'if(NOT IOS)\n  set(CMAKE_OSX_ARCHITECTURES "arm64;x86_64" CACHE STRING "" FORCE)\nendif()'
          if source.count(old) != 1:
              raise SystemExit("Unexpected SkyEmu architecture declaration")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          cmake -S build/skyemu-core -B build/skyemu-ios -G Xcode \
            -DIOS=ON \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DENABLE_RETRO_ACHIEVEMENTS=OFF \
            -DENABLE_HTTP_CONTROL_SERVER=OFF
          cmake --build build/skyemu-ios --config Release --target skyemu_libretro --parallel "$(sysctl -n hw.ncpu)"
          CORE_PATH=$(find build/skyemu-ios -type f -name 'skyemu_libretro*.dylib' -print -quit)
          test -n "$CORE_PATH"
          APP="build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app"
          mkdir -p "$APP/Frameworks"
          cp "$CORE_PATH" "$APP/Frameworks/skyemu_libretro_ios.dylib"
          cp build/skyemu-core/LICENSE "$APP/Frameworks/SkyEmu-LICENSE.txt"
          chmod 755 "$APP/Frameworks/skyemu_libretro_ios.dylib"
          file "$APP/Frameworks/skyemu_libretro_ios.dylib" | grep -q arm64

      - name: Compilar núcleo integrado Geolith
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          CORE_COMMIT="194024931935eff2092e36fc4f8e53e62ed11097"
          git clone --filter=blob:none https://github.com/libretro/geolith-libretro.git build/geolith-core
          git -C build/geolith-core checkout --detach "$CORE_COMMIT"
          IOSSDK=$(xcrun --sdk iphoneos --show-sdk-path)
          make -C build/geolith-core/libretro platform=ios-arm64 IOSSDK="$IOSSDK" -j"$(sysctl -n hw.ncpu)"
          CORE_PATH="build/geolith-core/libretro/geolith_libretro_ios.dylib"
          test -f "$CORE_PATH"
          APP="build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app"
          mkdir -p "$APP/Frameworks"
          cp "$CORE_PATH" "$APP/Frameworks/geolith_libretro_ios.dylib"
          cp build/geolith-core/LICENSE "$APP/Frameworks/Geolith-LICENSE.txt"
          chmod 755 "$APP/Frameworks/geolith_libretro_ios.dylib"
          file "$APP/Frameworks/geolith_libretro_ios.dylib" | grep -q arm64

      - name: Compilar núcleo integrado Gearsystem
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          CORE_COMMIT="2d9106f2063d1a6e0661cc8938bb7f8eb737bcae"
          git clone --filter=blob:none https://github.com/drhelius/Gearsystem.git build/gearsystem-core
          git -C build/gearsystem-core checkout --detach "$CORE_COMMIT"
          test "$(git -C build/gearsystem-core rev-parse HEAD)" = "$CORE_COMMIT"
          IOSSDK=$(xcrun --sdk iphoneos --show-sdk-path)
          make -C build/gearsystem-core/platforms/libretro \
            platform=ios-arm64 IOSSDK="$IOSSDK" IOS_MIN_VERSION=16.0 LTO=0 \
            -j"$(sysctl -n hw.ncpu)"
          CORE_PATH="build/gearsystem-core/platforms/libretro/gearsystem_libretro_ios.dylib"
          test -f "$CORE_PATH"
          APP="build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app"
          mkdir -p "$APP/Frameworks"
          cp "$CORE_PATH" "$APP/Frameworks/gearsystem_libretro_ios.dylib"
          cp build/gearsystem-core/LICENSE "$APP/Frameworks/Gearsystem-LICENSE.txt"
          cp ../LICENSES/GPL-3.0.txt "$APP/Frameworks/BRUMCLASSICS-Mobile-GPL-3.0.txt"
          chmod 755 "$APP/Frameworks/gearsystem_libretro_ios.dylib"
          file "$APP/Frameworks/gearsystem_libretro_ios.dylib" | grep -q arm64

      - name: Compilar núcleo integrado Nestopia
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          CORE_COMMIT="8f00f500912a847062de432e38765c7285483e62"
          git clone --filter=blob:none https://github.com/libretro/nestopia.git build/nestopia-core
          git -C build/nestopia-core checkout --detach "$CORE_COMMIT"
          test "$(git -C build/nestopia-core rev-parse HEAD)" = "$CORE_COMMIT"
          IOSSDK=$(xcrun --sdk iphoneos --show-sdk-path)
          make -C build/nestopia-core/libretro platform=ios-arm64 IOSSDK="$IOSSDK" -j"$(sysctl -n hw.ncpu)"
          CORE_PATH="build/nestopia-core/libretro/nestopia_libretro_ios.dylib"
          test -f "$CORE_PATH"
          APP="build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app"
          mkdir -p "$APP/Frameworks"
          cp "$CORE_PATH" "$APP/Frameworks/nestopia_libretro_ios.dylib"
          cp build/nestopia-core/COPYING "$APP/Frameworks/Nestopia-LICENSE.txt"
          chmod 755 "$APP/Frameworks/nestopia_libretro_ios.dylib"
          file "$APP/Frameworks/nestopia_libretro_ios.dylib" | grep -q arm64

      - name: Compilar núcleo integrado Beetle PCE Fast
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          CORE_COMMIT="3f946f277aef3aa99a95551618bbcd1dd2bda0d9"
          git clone --filter=blob:none https://github.com/libretro/beetle-pce-fast-libretro.git build/beetle-pce-fast-core
          git -C build/beetle-pce-fast-core checkout --detach "$CORE_COMMIT"
          test "$(git -C build/beetle-pce-fast-core rev-parse HEAD)" = "$CORE_COMMIT"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build/beetle-pce-fast-core/deps/zlib-1.2.11/zutil.h")
          source = path.read_text(encoding="utf-8")
          old = "#if defined(MACOS) || defined(TARGET_OS_MAC)"
          new = "#if defined(MACOS) /* Classic Mac only; modern iOS SDK provides fdopen. */"
          if source.count(old) != 1:
              raise SystemExit("Unexpected Beetle PCE Fast zlib Apple guard")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          IOSSDK=$(xcrun --sdk iphoneos --show-sdk-path)
          make -C build/beetle-pce-fast-core platform=ios-arm64 IOSSDK="$IOSSDK" -j"$(sysctl -n hw.ncpu)"
          CORE_PATH="build/beetle-pce-fast-core/mednafen_pce_fast_libretro_ios.dylib"
          test -f "$CORE_PATH"
          APP="build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app"
          mkdir -p "$APP/Frameworks"
          cp "$CORE_PATH" "$APP/Frameworks/mednafen_pce_fast_libretro_ios.dylib"
          cp build/beetle-pce-fast-core/COPYING "$APP/Frameworks/Beetle-PCE-Fast-LICENSE.txt"
          chmod 755 "$APP/Frameworks/mednafen_pce_fast_libretro_ios.dylib"
          file "$APP/Frameworks/mednafen_pce_fast_libretro_ios.dylib" | grep -q arm64

      - name: Compilar núcleo integrado bsnes-mercury Performance
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          CORE_COMMIT="79d7f9de218b6ffa65a80bbdc5828532bc239232"
          git clone --filter=blob:none https://github.com/libretro/bsnes-mercury.git build/bsnes-mercury-core
          git -C build/bsnes-mercury-core checkout --detach "$CORE_COMMIT"
          test "$(git -C build/bsnes-mercury-core rev-parse HEAD)" = "$CORE_COMMIT"
          IOSSDK=$(xcrun --sdk iphoneos --show-sdk-path)
          make -C build/bsnes-mercury-core platform=ios-arm64 PROFILE=performance IOSSDK="$IOSSDK" -j"$(sysctl -n hw.ncpu)"
          CORE_PATH="build/bsnes-mercury-core/bsnes_mercury_performance_libretro_ios.dylib"
          test -f "$CORE_PATH"
          APP="build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app"
          mkdir -p "$APP/Frameworks"
          cp "$CORE_PATH" "$APP/Frameworks/bsnes_mercury_performance_libretro_ios.dylib"
          cp build/bsnes-mercury-core/LICENSE "$APP/Frameworks/bsnes-mercury-LICENSE.txt"
          chmod 755 "$APP/Frameworks/bsnes_mercury_performance_libretro_ios.dylib"
          file "$APP/Frameworks/bsnes_mercury_performance_libretro_ios.dylib" | grep -q arm64

      - name: Compilar núcleo integrado Beetle WonderSwan
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          CORE_COMMIT="4b01295838ea89e3f1355bbe4cb5cf98aa6108cd"
          git clone --filter=blob:none https://github.com/libretro/beetle-wswan-libretro.git build/beetle-wswan-core
          git -C build/beetle-wswan-core checkout --detach "$CORE_COMMIT"
          test "$(git -C build/beetle-wswan-core rev-parse HEAD)" = "$CORE_COMMIT"
          IOSSDK=$(xcrun --sdk iphoneos --show-sdk-path)
          make -C build/beetle-wswan-core platform=ios-arm64 IOSSDK="$IOSSDK" -j"$(sysctl -n hw.ncpu)"
          CORE_PATH="build/beetle-wswan-core/mednafen_wswan_libretro_ios.dylib"
          test -f "$CORE_PATH"
          APP="build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app"
          mkdir -p "$APP/Frameworks"
          cp "$CORE_PATH" "$APP/Frameworks/mednafen_wswan_libretro_ios.dylib"
          cp build/beetle-wswan-core/COPYING "$APP/Frameworks/Beetle-WonderSwan-LICENSE.txt"
          chmod 755 "$APP/Frameworks/mednafen_wswan_libretro_ios.dylib"
          file "$APP/Frameworks/mednafen_wswan_libretro_ios.dylib" | grep -q arm64

      - name: Incluir backends experimentais iOS
        if: inputs.experimental
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app"
          IOSSDK=$(xcrun --sdk iphoneos --show-sdk-path)
          git clone --filter=blob:none https://github.com/libretro/mupen64plus-libretro-nx.git build/mupen64-core
          git -C build/mupen64-core checkout --detach 12edd2c74a517ff86dfa8cfc71ad75e4c10486d5
          git -C build/mupen64-core apply --unidiff-zero "$GITHUB_WORKSPACE/ios/patches/mupen64-ios-libpng.patch"
          make -C build/mupen64-core platform=ios-arm64 IOSSDK="$IOSSDK" DEBUG=0 HAVE_PARALLEL_RSP=0 HAVE_PARALLEL_RDP=0 HAVE_THR_AL=0 LLE=0 WITH_DYNAREC= -j"$(sysctl -n hw.ncpu)"
          cp build/mupen64-core/mupen64plus_next_libretro_ios.dylib "$APP/Frameworks/"
          cp build/mupen64-core/LICENSE "$APP/Frameworks/Mupen64Plus-Next-LICENSE.txt"
          git clone --filter=blob:none https://github.com/libretro/beetle-psx-libretro.git build/beetle-psx-core
          git -C build/beetle-psx-core checkout --detach 5ec9909f2654fb2041315a13fac0b704c5065c0e
          make -C build/beetle-psx-core platform=ios-arm64 IOSSDK="$IOSSDK" -j"$(sysctl -n hw.ncpu)"
          cp build/beetle-psx-core/mednafen_psx_libretro_ios.dylib "$APP/Frameworks/"
          cp build/beetle-psx-core/COPYING "$APP/Frameworks/Beetle-PSX-LICENSE.txt"
          git clone --filter=blob:none https://github.com/libretro/beetle-saturn-libretro.git build/beetle-saturn-core
          git -C build/beetle-saturn-core checkout --detach 65f05fa66f83e65e33be83aa433d883b4fd9509a
          make -C build/beetle-saturn-core platform=ios-arm64 IOSSDK="$IOSSDK" DEBUG=0 -j"$(sysctl -n hw.ncpu)"
          cp build/beetle-saturn-core/mednafen_saturn_libretro_ios.dylib "$APP/Frameworks/"
          cp build/beetle-saturn-core/COPYING "$APP/Frameworks/Beetle-Saturn-LICENSE.txt"
          git clone --filter=blob:none https://github.com/libretro/stella2014-libretro.git build/stella2014-core
          git -C build/stella2014-core checkout --detach 7d1361e407e63f29e52892655069e5fb4096e691
          make -C build/stella2014-core platform=ios-arm64 IOSSDK="$IOSSDK" -j"$(sysctl -n hw.ncpu)"
          cp build/stella2014-core/stella2014_libretro_ios.dylib "$APP/Frameworks/"
          cp build/stella2014-core/stella/license.txt "$APP/Frameworks/Stella2014-LICENSE.txt"
          git clone --filter=blob:none https://github.com/libretro/blastem.git build/blastem-core
          git -C build/blastem-core checkout --detach 1e0de94dc7e669c0925a22c0fccf6cdc837af0a0
          make -C build/blastem-core -f Makefile.libretro platform=ios-arm64 core -j"$(sysctl -n hw.ncpu)"
          cp build/blastem-core/blastem_libretro_ios.dylib "$APP/Frameworks/"
          cp build/blastem-core/COPYING "$APP/Frameworks/BlastEm-LICENSE.txt"
          cp build/blastem-core/libchdr/LICENSE.txt "$APP/Frameworks/BlastEm-libchdr-LICENSE.txt"
          cp build/blastem-core/lzma/LICENSE.txt "$APP/Frameworks/BlastEm-LZMA-LICENSE.txt"
          cp build/blastem-core/zlib/LICENSE "$APP/Frameworks/BlastEm-zlib-LICENSE.txt"
          for library in mupen64plus_next_libretro_ios.dylib mednafen_psx_libretro_ios.dylib mednafen_saturn_libretro_ios.dylib stella2014_libretro_ios.dylib blastem_libretro_ios.dylib; do
            chmod 755 "$APP/Frameworks/$library"
            file "$APP/Frameworks/$library" | grep -q arm64
          done
          bash build-heavy-experimental.sh ppsspp "$APP"
          bash build-heavy-experimental.sh flycast "$APP"
          bash build-heavy-experimental.sh dolphin "$APP"
          bash build-heavy-experimental.sh azahar "$APP"
          bash build-arcade-experimental.sh "$APP"
          /usr/libexec/PlistBuddy -c 'Add :BRUMExperimentalBackends bool true' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName BRUM Core Teste' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 46' "$APP/Info.plist"

      - name: Empacotar IPA pessoal
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          python3 package_ipa.py "build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app" build

      - name: Guardar build pessoal
        uses: actions/upload-artifact@v4
        with:
          name: BRUMCLASSICS-MOVEL-IOS-${{ inputs.experimental && 'EXPERIMENTAL' || 'PESSOAL' }}-0.15.1
          path: |
            ios/build/BRUMCLASSICS-MOVEL-IOS-*.ipa
            ios/build/BRUMCLASSICS-MOVEL-IOS-*.ipa.sha256
            ios/build/IPA-VALIDATION.json
          retention-days: 30
          if-no-files-found: error

      - name: Publicar versão pessoal para instalação
        if: github.ref == 'refs/heads/main' && !inputs.experimental
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("ios/ios-update.json", encoding="utf-8"))["version"])')
          TAG="ios-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "BRUMCLASSICS MÓVEL iOS ${VERSION}" --notes-file releases/ios-v${VERSION}/RELEASE-NOTES.md --prerelease
          fi
          gh release upload "$TAG" ios/build/BRUMCLASSICS-MOVEL-IOS-*.ipa ios/build/BRUMCLASSICS-MOVEL-IOS-*.ipa.sha256 ios/build/IPA-VALIDATION.json --clobber
