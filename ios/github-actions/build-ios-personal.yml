name: Build iOS pessoal

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-personal.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validar projeto e testes do pacote
        working-directory: ios
        run: |
          node validate-ios-project.js
          python3 -m unittest -v test_validate_ipa.py

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        working-directory: ios
        run: xcodegen generate

      - name: Compilar aplicativo sem assinatura
        working-directory: ios
        run: >-
          xcodebuild
          -project BRUMCLASSICSMobile.xcodeproj
          -scheme BRUMCLASSICSMobile
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Empacotar IPA pessoal
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          python3 package_ipa.py "build/DerivedData/Build/Products/Release-iphoneos/BRUMCLASSICSMobile.app" build

      - name: Guardar build pessoal
        uses: actions/upload-artifact@v4
        with:
          name: BRUMCLASSICS-MOVEL-IOS-PESSOAL-0.2.1
          path: |
            ios/build/BRUMCLASSICS-MOVEL-IOS-0.2.1.ipa
            ios/build/BRUMCLASSICS-MOVEL-IOS-0.2.1.ipa.sha256
            ios/build/IPA-VALIDATION.json
          retention-days: 30
          if-no-files-found: error
