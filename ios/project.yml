name: BRUMCLASSICSMobile
options:
  bundleIdPrefix: com.brumclassics
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_OBJC_BRIDGING_HEADER: BRUMCLASSICSMobile/BRUMCLASSICSMobile-Bridging-Header.h
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CURRENT_PROJECT_VERSION: 59
    MARKETING_VERSION: 0.26.0
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - ../third_party/rcheevos/include
      - ../third_party/rcheevos/src
      - ../shared/brum-core
      - ../shared/brum-core/libretro_shim
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - RC_DISABLE_LUA=1
      - RC_CLIENT_SUPPORTS_HASH=1
targets:
  Rcheevos:
    type: library.static
    platform: iOS
    sources:
      - path: ../shared/brum-core/RetroAchievementsRuntime.cpp
        compilerFlags:
          - -DRC_DISABLE_LUA=1
          - -DRC_CLIENT_SUPPORTS_HASH=1
      - path: ../shared/brum-core/PokemonFireRedAdapter.cpp
      - path: ../third_party/rcheevos/src
        excludes:
          - "rc_client_external.c"
          - "rc_client_external.h"
          - "rc_client_external_versions.h"
          - "rc_client_raintegration.c"
          - "rc_client_raintegration_internal.h"
          - "rapi/rc_api_editor.c"
        compilerFlags:
          - -DRC_DISABLE_LUA=1
          - -DRC_CLIENT_SUPPORTS_HASH=1
          - -w
    settings:
      base:
        CLANG_ENABLE_MODULES: NO
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
  BRUMCLASSICSMobile:
    type: application
    platform: iOS
    sources:
      - path: BRUMCLASSICSMobile
      - path: ../LICENSES/PokeAPI-LICENSE.txt
        buildPhase: resources
    dependencies:
      - target: Rcheevos
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brumclassics.mobile.ios
        PRODUCT_NAME: BRUMCLASSICSMobile
        INFOPLIST_FILE: BRUMCLASSICSMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - BRUMCLASSICSMobileTests
        - BRUMCLASSICSMobileUITests
  BRUMCLASSICSMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BRUMCLASSICSMobileTests
        excludes: [Fixtures]
      - path: build/test-fixtures/BrumTestCore.dylib
        buildPhase: resources
    dependencies:
      - target: BRUMCLASSICSMobile
  BRUMCLASSICSMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BRUMCLASSICSMobileUITests
    dependencies:
      - target: BRUMCLASSICSMobile
