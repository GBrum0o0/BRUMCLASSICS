plugins {
    id "com.android.application"
}

android {
    namespace "com.brumclassics.mobile"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.brumclassics.mobile"
        minSdk 26
        targetSdk 36
        versionCode 44
        versionName "0.32.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                targets "brumcore", "mgba_libretro", "skyemu_libretro", "geolith_libretro", "gearsystem_libretro", "nestopia_libretro", "mednafen_pce_fast_libretro", "mednafen_wswan_libretro", "bsnes_mercury_performance_libretro"
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main.assets.srcDir rootProject.file("../LICENSES")
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

def playCoreBinary = file("src/main/jniLibs/arm64-v8a/play_libretro_android.so")
tasks.register("verifyPlayCoreBinary") {
    doLast {
        if (!playCoreBinary.isFile() || playCoreBinary.length() < 1_000_000L) {
            throw new GradleException("Play! ARM64 core ausente. Execute android/fetch-play-core.ps1 antes de compilar.")
        }
    }
}
tasks.named("preBuild").configure { dependsOn("verifyPlayCoreBinary") }

tasks.register("verifyPpssppCore") {
    doLast {
        def binary = file("src/main/jniLibs/arm64-v8a/ppsspp_libretro_android.so")
        def atlas = file("src/main/assets/system/PPSSPP/ppge_atlas.zim")
        def font = file("src/main/assets/system/PPSSPP/flash0/font/ltn0.pgf")
        if (!binary.isFile() || binary.length() < 1_000_000L || !atlas.isFile() || !font.isFile()) {
            throw new GradleException("PPSSPP ARM64/recursos ausentes. Execute android/fetch-ppsspp-core.ps1 antes de compilar.")
        }
    }
}
tasks.named("preBuild").configure { dependsOn("verifyPpssppCore") }
