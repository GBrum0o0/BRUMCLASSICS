plugins {
    id "com.android.application"
}

android {
    namespace "com.brumclassics.mobile"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.brumclassics.mobile"
        minSdk 26
        targetSdk 36
        versionCode 36
        versionName "0.24.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                targets "brumcore", "mgba_libretro", "skyemu_libretro", "geolith_libretro", "gearsystem_libretro", "nestopia_libretro", "mednafen_pce_fast_libretro", "bsnes_mercury_performance_libretro"
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main.assets.srcDir rootProject.file("../LICENSES")
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

def playCoreBinary = file("src/main/jniLibs/arm64-v8a/play_libretro_android.so")
tasks.register("verifyPlayCoreBinary") {
    doLast {
        if (!playCoreBinary.isFile() || playCoreBinary.length() < 1_000_000L) {
            throw new GradleException("Play! ARM64 core ausente. Execute android/fetch-play-core.ps1 antes de compilar.")
        }
    }
}
tasks.named("preBuild").configure { dependsOn("verifyPlayCoreBinary") }
