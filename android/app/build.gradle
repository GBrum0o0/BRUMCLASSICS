plugins {
    id "com.android.application"
}

android {
    namespace "com.brumclassics.mobile"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.brumclassics.mobile"
        minSdk 26
        targetSdk 36
        versionCode 31
        versionName "0.22.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                targets "brumcore", "mgba_libretro"
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}
